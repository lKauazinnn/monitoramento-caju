# =============================================================================
# nginx do dashboard na stack local
# =============================================================================
# EXISTE POR UM MOTIVO ESPECÍFICO: sem Cache-Control, o nginx serve apenas ETag e
# Last-Modified, e o navegador aplica cache heurístico — ele decide sozinho
# guardar o arquivo por um tempo e NÃO revalida.
#
# O sintoma é cruel: você edita app.js, recarrega a página e nada muda. Nenhum
# erro, nenhuma pista. Foi exatamente o que aconteceu — a tela continuou
# mostrando o aviso de uma versão anterior do arquivo, e o login novo nem
# chegava a ser executado.
#
# Numa stack de desenvolvimento, onde os arquivos mudam a toda hora, cache é
# apenas prejuízo. `no-store` obriga o navegador a buscar sempre.
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/css application/javascript application/json;

    # Nunca guardar nada. Vale para .html, .js, .css e para o dev-config.json.
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;

    # ETag desligado junto: com no-store ele é inútil, e mantê-lo faria o
    # navegador ainda enviar If-None-Match e receber 304 em alguns casos.
    etag off;
    if_modified_since off;

    # O dashboard é uma página única; qualquer caminho desconhecido cai nela.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Chart.js é a única coisa que faz sentido cachear, e mesmo assim só por
    # pouco tempo: ele é versionado no repositório e não muda entre execuções.
    location = /vendor/chart.umd.js {
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Log em formato legível: ao investigar "o dashboard não carrega", o que
    # importa é ver qual requisição falhou e com que status.
    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log warn;
}
