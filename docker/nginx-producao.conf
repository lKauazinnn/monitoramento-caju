# =============================================================================
# nginx de producao — uma porta so, atras do Cloudflare Tunnel
# =============================================================================
# ESTE ARQUIVO E O QUE TORNA A MIGRACAO BARATA.
#
# Ele reproduz os CAMINHOS do Supabase. Assim o unico campo que muda em
# qualquer lugar do sistema e o HOST:
#
#   agente      https://HOST/functions/v1/ingest
#   instalador  https://HOST/functions/v1/ingest/instalar.ps1
#   painel      https://HOST/rest/v1
#
# Sem isto, mudar de provedor exigiria tocar no agente, no instalador, no
# painel e nos 45 config.json. Com isto, e trocar o dominio.
#
# O tunel do Cloudflare aponta para AQUI (uma unica porta em 127.0.0.1) e faz o
# HTTPS com certificado valido na borda -- por isso nao ha certificado nem
# porta 443 nesta configuracao.
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/css application/javascript application/json;

    # Lote do spool de uma maquina que ficou dias sem enviar chega grande. O
    # padrao do nginx e 1 MB, e estourar isso devolve 413 -- que o agente
    # trataria como falha permanente do envio, e a maquina nunca recuperaria o
    # atraso. O teto real de amostras por lote quem impoe e o banco
    # (ingest_max_batch_size); aqui so nao pode ser o gargalo.
    client_max_body_size 16m;

    # -------------------------------------------------------------------------
    # RESOLUCAO DE NOME EM TEMPO DE REQUISICAO, e isto NAO e detalhe
    # -------------------------------------------------------------------------
    # O nginx resolve o nome dos upstreams UMA VEZ, na partida, e ABORTA se
    # algum nao resolver ("host not found in upstream"). Com restart automatico
    # isso vira laco: enquanto o PostgREST estiver fora, o nginx nao sobe.
    #
    # Consequencia medida aqui antes de ir para producao: o PostgREST caiu por
    # senha errada e derrubou junto a INGESTAO das 45 maquinas -- que nao
    # depende dele para nada. Num sistema de monitoramento e o modo de falha
    # exatamente invertido: a parte que so serve a tela levaria embora a parte
    # que recebe os dados.
    #
    # 127.0.0.11 e o DNS interno do Docker. Usando o nome dentro de uma VARIAVEL,
    # o nginx adia a resolucao para a hora da requisicao: sobe mesmo com o
    # upstream fora, devolve 502 so naquela rota, e volta sozinho quando o
    # servico retorna.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $up_rest   rest;
    set $up_ingest ingest;

    # -------------------------------------------------------------------------
    # Ingestao: o que os 45 agentes procuram
    # -------------------------------------------------------------------------
    # Duas regras porque o servidor de ingestao aceita POST em '/ingest' e serve
    # os arquivos em '/instalar.ps1' e '/agente.ps1' na raiz.

    # Com o nome numa variavel, o nginx NAO aplica mais o corte de prefixo que a
    # barra final do proxy_pass faria. Por isso cada rota tem um `rewrite`
    # explicito -- o que e melhor de ler de qualquer forma: da para ver o
    # caminho exato que chega no servico.

    # POST do lote. Match exato, sem barra final.
    location = /functions/v1/ingest {
        rewrite ^ /ingest break;
        proxy_pass http://$up_ingest:3001;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Tudo abaixo: instalar.ps1, agente.ps1, healthz.
    location /functions/v1/ingest/ {
        rewrite ^/functions/v1/ingest/(.*)$ /$1 break;
        proxy_pass http://$up_ingest:3001;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # -------------------------------------------------------------------------
    # API REST: o que o painel consome
    # -------------------------------------------------------------------------
    location /rest/v1/ {
        # CORS, porque o painel NAO mora aqui.
        #
        # Ele esta na Vercel, em monitoramento-cajupar.vercel.app, e a API esta
        # neste servidor. Sao origens diferentes, entao o navegador exige
        # permissao explicita -- e sem ela o sintoma e cruel: a tela carrega
        # normalmente e as chamadas somem, bloqueadas pelo navegador, sem erro
        # visivel na pagina.
        #
        # A ORIGEM VAI NUMA LISTA, NAO EM '*'. Com asterisco, qualquer site que
        # a vitima visitasse poderia fazer o navegador dela falar com esta API
        # usando o token dela. O painel e um so; entao a lista tem um item.
        set $cors "";
        if ($http_origin = "https://monitoramento-cajupar.vercel.app") { set $cors $http_origin; }

        # Preflight: o navegador pergunta ANTES de mandar a requisicao de
        # verdade. Tem de ser respondido aqui, sem chegar no PostgREST -- ele
        # devolveria 404 no OPTIONS e o navegador cancelaria tudo.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $cors always;
            add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "authorization, apikey, content-type, prefer, range, accept-profile, content-profile, x-client-info" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            return 204;
        }

        # ESCONDER O CORS DO POSTGREST, e isto e a parte que importa de verdade.
        #
        # Medido nesta stack: o PostgREST responde com
        # `Access-Control-Allow-Origin: *` por conta propria. Sem esconder, o
        # add_header abaixo nao substitui nada -- ele ACRESCENTA, e o navegador
        # continua vendo o asterisco. O resultado seria uma restricao que parece
        # existir na configuracao e nao existe no ar: qualquer site visitado por
        # alguem logado poderia falar com esta API usando o token daquela pessoa.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;

        add_header Access-Control-Allow-Origin   $cors always;
        # content-range e como o PostgREST informa o total de linhas. Sem
        # expor, o painel pagina no escuro.
        add_header Access-Control-Expose-Headers "content-range, content-location" always;

        rewrite ^/rest/v1/(.*)$ /$1 break;
        proxy_pass http://$up_rest:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # -------------------------------------------------------------------------
    # O painel
    # -------------------------------------------------------------------------
    # no-store continua valendo em producao, e nao e desleixo: este painel ja
    # perdeu horas com "editei o arquivo, recarreguei e nada mudou" por cache
    # heuristico do navegador. O arquivo e pequeno e a rede e a mesma.
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    etag off;
    if_modified_since off;

    # dev-config.json NUNCA EM PRODUCAO.
    #
    # O painel faz fetch('dev-config.json') sozinho (dash.js). Esse arquivo
    # existe para a stack local abrir SEM tela de login: ele carrega devToken e
    # pedirLogin. Local isso e seguro, porque a stack local so escuta em
    # loopback. Servido por um endereco publico, e acesso ao painel sem
    # autenticacao para quem souber a URL.
    #
    # O pacote de instalacao nao leva o arquivo, mas confiar nisso e confiar em
    # ninguem copiar a pasta errada um dia. A recusa fica aqui, no servidor, que
    # e onde ela nao depende de disciplina de quem copia.
    location = /dev-config.json {
        return 404;
        access_log off;
    }

    # ARQUIVO OCULTO NUNCA E SERVIDO.
    #
    # A raiz web e a pasta dashboard/, e o nginx serve dotfile normalmente. Foi
    # encontrado um dashboard/.env.local ali dentro -- ignorado pelo git, o que
    # esconde do repositorio mas NAO do servidor web. Sem esta regra,
    # https://HOST/.env.local devolve o arquivo para qualquer um.
    #
    # `^~` garante precedencia sobre o location / e sobre try_files, e o 404 (em
    # vez de 403) nao confirma que o arquivo existe.
    location ~ /\. {
        return 404;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /vendor/chart.umd.js {
        add_header Cache-Control "public, max-age=3600" always;
    }

    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log warn;
}
