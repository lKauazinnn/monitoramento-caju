<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitoramento de Infraestrutura</title>

  <!-- NÃO EXISTE TELA DE LOGIN NESTA PÁGINA.
       Na stack local o dashboard abre direto, com o token que o dev-up.ps1
       grava em dev-config.json. No modo Supabase o login vive em login.html,
       que autentica e redireciona para cá — este arquivo nunca desenha
       formulário de credencial.

       O ?v= muda a URL do arquivo: um navegador que já guardou "dash.js" tem
       aquela cópia indexada pela URL exata, e pedir "dash.js?v=8" é pedir outro
       recurso. AO ALTERAR dash.js OU styles.css, SUBA ESTE NÚMERO. -->
  <link rel="stylesheet" href="styles.css?v=8">
</head>
<body>

<div id="app">

  <header class="topo">
    <div class="topo-esq">
      <h1>Monitoramento</h1>
      <span id="indicador-conexao" class="pill pill-neutro">conectando…</span>
    </div>

    <div class="topo-dir">
      <span id="rotulo-usuario" class="usuario"></span>
      <button id="btn-atualizar" class="btn-secundario" type="button">Atualizar</button>
    </div>
  </header>

  <section class="tiras" aria-label="Resumo geral">
    <div class="tira"><span class="tira-num" id="kpi-total">–</span><span class="tira-rot">máquinas</span></div>
    <div class="tira tira-ok"><span class="tira-num" id="kpi-online">–</span><span class="tira-rot">online</span></div>
    <div class="tira tira-ruim"><span class="tira-num" id="kpi-offline">–</span><span class="tira-rot">offline</span></div>
    <div class="tira"><span class="tira-num" id="kpi-nunca">–</span><span class="tira-rot">nunca vistas</span></div>
    <div class="tira tira-alerta"><span class="tira-num" id="kpi-alertas">–</span><span class="tira-rot">alertas abertos</span></div>
    <div class="tira tira-alerta"><span class="tira-num" id="kpi-disco">–</span><span class="tira-rot">disco crítico</span></div>
    <div class="tira tira-alerta"><span class="tira-num" id="kpi-servicos">–</span><span class="tira-rot">serviços parados</span></div>
  </section>

  <nav class="barra-filtros" aria-label="Filtros">
    <label for="filtro-marca">Marca</label>
    <select id="filtro-marca"><option value="">todas</option></select>

    <label for="filtro-loja">Loja</label>
    <select id="filtro-loja"><option value="">todas</option></select>

    <label for="filtro-status">Status</label>
    <select id="filtro-status">
      <option value="">todos</option>
      <option value="offline">offline</option>
      <option value="online">online</option>
      <option value="never_seen">nunca vistas</option>
      <option value="disabled">desativadas</option>
    </select>

    <label for="busca">Buscar</label>
    <input type="search" id="busca" placeholder="máquina, host, loja">

    <span class="espaco"></span>
    <span id="rodape-atualizacao" class="atualizacao"></span>
  </nav>

  <main id="conteudo" aria-live="polite">
    <p class="vazio">Carregando…</p>
  </main>
</div>

<!-- =========================================================================
     Painel de detalhe
     ========================================================================= -->
<div id="painel-fundo" class="painel-fundo" hidden></div>

<aside id="painel" class="painel" hidden aria-label="Detalhe da máquina">
  <header class="painel-topo">
    <div>
      <h2 id="painel-titulo"></h2>
      <p id="painel-sub" class="painel-sub"></p>
    </div>
    <button id="btn-fechar-painel" class="btn-fechar" type="button" aria-label="Fechar">×</button>
  </header>

  <div class="painel-corpo">
    <dl id="painel-dados" class="dados"></dl>

    <div class="faixas" role="tablist" aria-label="Período do gráfico">
      <button class="faixa ativa" data-faixa="24h" type="button" role="tab">24 h</button>
      <button class="faixa" data-faixa="7d" type="button" role="tab">7 d</button>
      <button class="faixa" data-faixa="30d" type="button" role="tab">30 d</button>
    </div>

    <div class="grafico-caixa"><canvas id="grafico-cpu"></canvas></div>
    <div class="grafico-caixa"><canvas id="grafico-mem"></canvas></div>
    <div class="grafico-caixa"><canvas id="grafico-disco"></canvas></div>

    <h3>Eventos recentes</h3>
    <ul id="painel-eventos" class="eventos"></ul>
  </div>
</aside>

<div id="brinde" class="brinde" hidden role="status"></div>

<!-- Faixa de erro.
     Sem ela, um erro de script produz o sintoma mais difícil de diagnosticar: a
     página não fazer nada, sem mensagem em lugar nenhum. -->
<div id="falha-js" class="falha-js" hidden role="alert">
  <strong>Erro</strong>
  <pre id="falha-js-msg"></pre>
  <p class="falha-js-dica">
    Diagnóstico completo em <a href="diagnostico.html" style="color:#fecaca">diagnostico.html</a>
  </p>
</div>

<script src="vendor/chart.umd.js"></script>
<script src="config.js?v=8"></script>
<script src="dash.js?v=8"></script>
</body>
</html>
