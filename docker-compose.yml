# =============================================================================
# Stack local — para o sistema rodar de ponta a ponta sem depender do Supabase
# =============================================================================
# Sobe com:  .\scripts\dev-up.ps1
#
# Postgres 16 + PostgREST. PostgREST é exatamente o que o Supabase expõe como
# /rest/v1, então o dashboard e a ingestão falam o MESMO protocolo aqui e lá —
# apontar para o Supabase é trocar duas linhas em dashboard/config.js.
#
# Regra 8 aplicada: a porta do PostgreSQL NÃO é publicada. Só o PostgREST é
# exposto, e apenas em 127.0.0.1. Sem senha padrão em fallback: a sintaxe
# ${VAR:?mensagem} faz o compose FALHAR se a variável não existir.
# =============================================================================

services:
  db:
    image: postgres:16
    container_name: monitor-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env.local}
      POSTGRES_DB: postgres
      # Fuso do servidor em UTC: é o que o Supabase usa, e o que faz os
      # timestamps do agente serem interpretados igual nos dois ambientes.
      TZ: UTC
      PGTZ: UTC
    # SEM `ports:` de propósito. O acesso é por `docker exec` ou pela rede
    # interna do compose.
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  rest:
    image: postgrest/postgrest:v12.2.3
    container_name: monitor-rest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD:?}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      # anon é o papel de quem chega SEM token. Como a migration 0010 revoga
      # tudo de anon, um cliente sem JWT não lê nada — mesmo comportamento do
      # Supabase.
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env.local (32+ caracteres)}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_SERVER_PORT: 3000
      PGRST_OPENAPI_MODE: disabled
      PGRST_DB_MAX_ROWS: 10000
    ports:
      # Somente loopback: nada disto fica exposto na rede da máquina.
      #
      # `:-` com valor padrão é aceitável AQUI e não viola a regra 8: porta não é
      # segredo. Senha e segredo de JWT usam `:?` logo acima, que faz o compose
      # falhar em vez de subir com valor conhecido.
      - "127.0.0.1:${REST_PORT:-3000}:3000"

  # Endpoint de ingestão — o equivalente local da Edge Function.
  #
  # Existe para que agentes em OUTRAS máquinas carreguem somente o token da
  # própria máquina. Sem ele, cada PC precisaria de uma credencial service_role
  # (acesso total ao banco) no disco, o que a regra 1 proíbe.
  #
  # É o ÚNICO serviço exposto na rede: Postgres não publica porta (regra 8) e o
  # PostgREST fica em loopback. Quem vem de fora entra por aqui, e aqui exige o
  # segredo compartilhado (regra 6) mais o token da máquina.
  ingest:
    image: node:24-alpine
    container_name: monitor-ingest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3001
      POSTGREST_URL: http://rest:3000
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env.local}
      INGEST_SHARED_SECRET: ${INGEST_SHARED_SECRET:?defina INGEST_SHARED_SECRET no .env.local}
    volumes:
      - ./docker/ingest-local/server.mjs:/app/server.mjs:ro
      # lib.ts vem do MESMO arquivo que a Edge Function usa. Duplicar a lógica
      # aqui criaria duas versões da mesma regra.
      - ./supabase/functions/ingest/lib.ts:/app/lib.ts:ro
      # Servidos por GET, sem segredo: sao o agente e o instalador, publicos no
      # repositorio. Servir daqui e nao do nginx e o que permite manter o
      # dashboard restrito a loopback — a unica porta na rede continua sendo esta.
      - ./agent/agente-powershell.ps1:/app/agente.ps1:ro
      - ./docker/ingest-local/instalar.ps1:/app/instalar.ps1:ro
    working_dir: /app
    # --experimental-strip-types: o servidor importa lib.ts direto, sem build.
    command: ["node", "--experimental-strip-types", "server.mjs"]
    ports:
      # 0.0.0.0 de propósito: é o que permite outro PC da rede alcançar.
      - "${INGEST_PORT:-3010}:3001"

  # Servidor estático para o dashboard. Nginx só porque abrir o index.html
  # direto do disco (file://) faz o navegador bloquear as chamadas fetch por
  # CORS, e o sintoma seria "dashboard vazio sem erro".
  web:
    image: nginx:1.27-alpine
    container_name: monitor-web
    restart: unless-stopped
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      # Cache-Control: no-store. Sem esta configuração o navegador guarda o
      # app.js por conta própria e edições no dashboard simplesmente não
      # aparecem — sem erro nenhum. Ver o comentário no próprio arquivo.
      - ./docker/nginx-dashboard.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"

volumes:
  db-data:
